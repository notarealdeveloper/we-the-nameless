name: Build PDF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build with TeX Live
        uses: xu-cheng/texlive-action@v3
        with:
          scheme: full
          run: make

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: build/*.pdf
