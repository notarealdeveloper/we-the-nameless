name: Make

on:
  workflow_dispatch:
    inputs:
      target:
        description: Make target to run
        required: true
        default: ci
        type: choice
        options:
          - ci
          - all
          - pdf
          - draft
          - clean
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            make \
            texlive-luatex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-arabic \
            texlive-lang-chinese \
            fonts-freefont-otf \
            fonts-dejavu-core \
            fonts-noto-cjk

      - name: Run make
        run: make "${{ github.event.inputs.target || 'ci' }}"

      - name: Upload PDF and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: we-the-nameless-build
          path: |
            master.pdf
            master.log
            build/master.log
          if-no-files-found: ignore
