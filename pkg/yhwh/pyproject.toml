[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "yhwh"
version = "0.1.0"
description = "Lossless source-aware Biblical Hebrew and English corpus analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jason Wilkes and contributors"}]
keywords = ["biblical-hebrew", "documentary-hypothesis", "corpus", "text-analysis", "concordance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2",
]
all = ["yhwh[plots,dev]"]

[project.scripts]
yhwh = "yhwh.cli:main"

[project.urls]
Homepage = "https://example.invalid/yhwh"

[tool.hatch.build.targets.wheel]
packages = ["src/yhwh"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[tool.coverage.run]
source = ["yhwh"]
branch = true
