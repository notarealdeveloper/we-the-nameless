[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "yhwh"
version = "0.1.0"
description = "Lossless source-aware Biblical Hebrew and English corpus analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Jason Wilkes and contributors"}]
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
yhwh = "yhwh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yhwh"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
