[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "font-magic"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "numpy>=1.26", "fonttools>=4.45", "jsonschema>=4.20"]

[tool.setuptools.packages.find]
include = ["fontmagic*"]
